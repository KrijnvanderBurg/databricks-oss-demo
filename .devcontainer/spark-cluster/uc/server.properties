# Unity Catalog server configuration (mounted over the image default).
server.env=prod
server.port=8080

# External OIDC authentication via Keycloak. All API calls now require a
# bearer token; users must also exist in UC's local user database.
server.authorization=enable
server.authorization-url=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/auth
server.token-url=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
server.client-id=lakehouse-client
server.client-secret=lakehouse-client-secret
# Issuer of the id_tokens accepted in the token exchange (must match token iss).
server.allowed-issuers=http://keycloak:8080/realms/lakehouse
# Accepted aud claim of the id_tokens (the Keycloak client id).
server.audiences=lakehouse-client

# NOTE: UC credential vending is not used. UC OSS vends either AWS-STS-derived
# or static+sessionToken credentials, neither of which SeaweedFS accepts.
# Spark jobs access s3a://lakehouse directly with per-user STS credentials
# obtained from SeaweedFS (see spark-submit.sh and 00-notebook-spark-init.py).

