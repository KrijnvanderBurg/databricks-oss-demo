# Event logging settings
spark.eventLog.enabled true
spark.eventLog.dir /opt/spark/events

# Job execution properties
spark.network.timeout 120s
spark.executor.memory 2g
spark.driver.memory 2g
spark.blockManager.port 7079
spark.executor.port 7080

# Driver host settings - spark-client is the only container that ever runs
# spark-submit in this setup, so it's safe to hardcode here.
spark.driver.host spark-client
spark.driver.bindAddress 0.0.0.0

# History server settings
spark.history.fs.logDirectory /opt/spark/events
spark.history.retainedApplications 50
spark.history.ui.maxApplications 100

# ============================================================================
# Unity Catalog Configuration (Delta Lake via unitycatalog-spark connector)
# ============================================================================
# Resolve the Delta Lake + Unity Catalog connector jars at submit time. Ivy
# downloads them on the driver and ships them to the executors, so the worker
# images do not need to be rebuilt. delta-spark's minor version tracks Spark's
# (4.1.x <-> Spark 4.1.x); hadoop-aws must match Spark's bundled hadoop-client.
spark.jars.packages io.delta:delta-spark_2.13:4.1.0,io.unitycatalog:unitycatalog-spark_2.13:0.4.1,org.apache.hadoop:hadoop-aws:3.4.2

# Delta Lake SQL extension
spark.sql.extensions io.delta.sql.DeltaSparkSessionExtension

# Register the "lakehouse" catalog, created by the admin user (see
# 03-create-catalog.sh). The pre-seeded "unity" catalog still exists
# in Unity Catalog but is unused here.
spark.sql.catalog.lakehouse io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.lakehouse.uri http://unity-catalog:8080
# UC auth is ENABLED: spark.sql.catalog.lakehouse.token is injected per run by
# 04-run-spark-job-with-auth.sh. Jobs without a valid token fail with 401
# UNAUTHENTICATED - see 05-run-spark-job-without-auth.sh.

# Make the built-in session catalog Delta-aware for local (non-UC) tables
spark.sql.catalog.spark_catalog org.apache.spark.sql.delta.catalog.DeltaCatalog

# Use the lakehouse catalog as the default catalog
spark.sql.defaultCatalog lakehouse

# ============================================================================
# SeaweedFS S3 (data storage). Credentials are per-user temporary STS
# credentials injected per run by 04-run-spark-job-with-auth.sh.
# ============================================================================
spark.hadoop.fs.s3a.endpoint http://seaweedfs-s3:8333
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.TemporaryAWSCredentialsProvider
